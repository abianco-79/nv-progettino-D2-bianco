services:
  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  client:
    build: .
    container_name: minio-client
    depends_on:
      minio:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./src:/app/src
      - ./data:/app/data

volumes:
  minio-data:
